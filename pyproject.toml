[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ue-agent-backend"
version = "0.1.0"
description = "Local AI Agent backend for Unreal Editor development workflows."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "orjson>=3.10,<4.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.11,<1.0",
]
agent = [
    "langchain>=0.3,<0.4",
    "langgraph>=0.2,<0.3",
]
rag = [
    "docling>=2.0,<3.0",
    "qdrant-client>=1.13,<2.0",
    "unstructured>=0.16,<0.17; python_version < '3.13'",
]
observability = [
    "langsmith>=0.3,<0.4",
    "opentelemetry-api>=1.30,<2.0",
    "opentelemetry-sdk>=1.30,<2.0",
    "prometheus-client>=0.21,<1.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"app/db/models/*.py" = ["F821", "UP037"]
"app/db/migrations/versions/*.py" = ["I001"]
