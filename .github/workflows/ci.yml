name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      EMBEDDING_ENABLED: "false"
      KB_SOURCE_PATHS: "./README.md,./knowledge,./docs"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check app tests scripts

      - name: Tests
        run: python -m pytest tests/unit tests/contract -q
