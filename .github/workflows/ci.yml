name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      EMBEDDING_ENABLED: "false"
      KB_SOURCE_PATHS: "./README.md,./knowledge,./docs"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check app tests scripts

      - name: Tests
        run: python -m pytest tests/unit tests/contract tests/eval tests/integration

      - name: RAG eval smoke
        run: >
          python scripts/run_rag_eval.py
          --source-path ./README.md
          --source-path ./docs
          --source-path ./knowledge
          --top-k 4
          --min-hit-at-k 0.25
          --min-route-accuracy 0.75
          --output storage/artifacts/evals/ci-rag-eval.json
          --markdown-output storage/artifacts/evals/ci-rag-eval.md

      - name: Upload RAG eval report
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-report
          path: |
            storage/artifacts/evals/ci-rag-eval.json
            storage/artifacts/evals/ci-rag-eval.md
